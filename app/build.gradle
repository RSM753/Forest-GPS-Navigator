plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.forestgps.navigator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.forestgps.navigator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
}
